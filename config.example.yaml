# VMware Disk Health - standalone configuration.
# The Home Assistant app uses the same structure through its options page.

hosts:
  - name: sa-esxi-01
    address: sa-esxi-01.lan
    username: root
    # Leave empty to use the app's SSH key (see `vmware-disk-health pubkey`).
    password: ""
    # auto: use smartctl if the community VIB is installed, none: never.
    smartctl_path: auto
    # Glob patterns on device id, serial or model.
    exclude: []
  - name: sc-esxi-01
    address: sc-esxi-01.lan

poll_interval_minutes: 60
retention_raw_days: 90

thresholds:
  life_remaining_warn_pct: 20
  life_remaining_crit_pct: 10
  temp_hdd_warn_c: 50
  temp_hdd_crit_c: 60
  temp_ssd_warn_c: 60
  temp_ssd_crit_c: 70
  temp_nvme_warn_c: 70
  temp_nvme_crit_c: 80
  use_drive_temp_limit: true
  # SSDs retire worn blocks normally: a stable count below this is fine,
  # any increase within a week still warns. Hard disks warn on any.
  ssd_reallocated_warn_count: 10

# Home Assistant entities. Point this at your broker; in the Home Assistant app
# the Supervisor provides it automatically and nothing needs to be set here.
mqtt:
  enabled: false
  host: ""
  port: 1883
  username: ""
  password: ""
  tls: false
  discovery_prefix: homeassistant
  base_topic: vmware-disk-health

# Notifications sent by the app itself. With Home Assistant, automate on the
# entities instead.
alerts:
  enabled: false
  min_severity: warning   # or "critical"
  notify_recovery: true
  notify_host_unreachable: true
  # ntfy_url: https://ntfy.sh/my-disk-alerts
  # gotify_url: https://gotify.lan
  # gotify_token: ""
  # smtp_host: smtp.example.com
  # smtp_port: 587
  # smtp_username: ""
  # smtp_password: ""
  # smtp_from: disks@example.com
  # smtp_to: me@example.com

disk_overrides: []
