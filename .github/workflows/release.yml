name: Publish image

# The Home Assistant app pulls ghcr.io/<repo>:<version>, and the app repository
# refuses a version bump before that tag exists, so publish here first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version from the tag must match pyproject
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          module=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/vmware_disk_health/__init__.py)
          echo "tag=$tag pyproject=$project module=$module"
          test "$tag" = "$project" && test "$tag" = "$module"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
