[project]
name = "vmware-disk-health"
version = "26.09.18"
description = "SMART and SSD health monitoring for VMware ESXi hosts, standalone or as a Home Assistant app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dominik Steiner", email = "contact@dominik.st" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.24.0",
    "fastapi>=0.141.1",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
vmware-disk-health = "vmware_disk_health.cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# Line length is enforced by `ruff format`; long SQL strings are left alone.
ignore = ["E501"]
